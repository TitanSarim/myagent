# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: localcode

before:
  hooks:
    - go mod tidy

builds:
  - id: localcode
    main: ./cmd/localcode
    binary: localcode
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - repository:
      owner: sarim
      name: homebrew-tap
    skip_upload: true
    homepage: https://github.com/sarim/localcode
    description: Local AI coding CLI powered by Qwen via Ollama
    install: |
      bin.install "localcode"
